<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi promedio calculadora</title>
</head>
<body>
    <header>
        <h1>Gestor Académico</h1>
        <p> Calcula tu nota final y evalua tu rendimiento :b</p>
    </header>

    <main>
        <form: id="form-notas">
            <section class="seccion-bloque">
                <h2>1. Informacion del Ramo</h2>

            <div class="grupo-campo">
                <label for="ramo">Nombre del Ramo:</label>
                <input type="text" id="ramo" placeholder="Ej: EDO">
            </div>

            </section>
        </form>

     
        <section class="seccion-bloque">
                <h2>2. Ingreso de Evaluaciones</h2>
                
                <div class="grupo-campo">
                    <label>Nota Cátedra 1:</label>
                    <input type="number" id="nota1" min="1" max="7" step="0.1" placeholder="1.0 - 7.0">
                    <input type="number" id="porcentaje1" min="1" max="100" placeholder="%">
                </div>

                <div class="grupo-campo">
                    <label>Nota Cátedra 2:</label>
                    <input type="number" id="nota2" min="1" max="7" step="0.1" placeholder="1.0 - 7.0">
                    <input type="number" id="porcentaje2" min="1" max="100" placeholder="%">
                </div>

                <div class="grupo-campo">
                    <label>Nota Cátedra 3:</label>
                    <input type="number" id="nota3" min="1" max="7" step="0.1" placeholder="1.0 - 7.0">
                    <input type="number" id="porcentaje3" min="1" max="100" placeholder="%">
                </div>

                <div class="grupo-campo">
                    <label>Nota Cátedra 4:</label>
                    <input type="number" id="nota4" min="1" max="7" step="0.1" placeholder="1.0 - 7.0">
                    <input type="number" id="porcentaje4" min="1" max="100" placeholder="%">
                </div>
            </section>
            
            
    </main>

    
</body>
</html>
